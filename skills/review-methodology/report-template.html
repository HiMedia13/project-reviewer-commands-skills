<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>프로젝트 리뷰 — {{REPO}}</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 60rem; padding: 0 1rem; }
  h1, h2 { line-height: 1.2; }
  .meta { color: #666; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  th, td { border: 1px solid #ccc; padding: 6px 9px; text-align: left; vertical-align: top; }
  th { background: #f2f2f2; }
  .headline { background: #eef6ff; border: 1px solid #b9d8ff; padding: 1rem; border-radius: 6px; }
  .score { font-weight: 700; }
  .sev-high { color: #b00020; font-weight: 700; }
  .sev-medium { color: #b06a00; }
  .sev-low { color: #555; }
  details { border: 1px solid #ddd; border-radius: 6px; margin: .5rem 0; padding: .5rem .75rem; }
  summary { cursor: pointer; font-weight: 600; }
  code { background: #f4f4f4; padding: 0 4px; border-radius: 3px; }
</style>
</head>
<body>
<h1>프로젝트 리뷰</h1>
<p class="meta">{{REPO}} @ {{COMMIT}} · 모드: {{MODE}} · 생성 {{GENERATED_AT}}</p>

<section class="headline">
  <h2>기술 스택 적합성 (핵심)</h2>
  <p><strong>목적:</strong> {{PURPOSE}}</p>
  <table>
    <thead><tr><th>기술</th><th>역할</th><th>의도대로</th><th>목적 적합성</th><th>근거</th><th>증거</th></tr></thead>
    <tbody>{{STACK_ROWS}}</tbody>
  </table>
  <p class="score">종합: {{STACK_VERDICT}} — 점수: {{STACK_SCORE}}</p>
</section>

<section>
  <h2>점수 (보조)</h2>
  <table>
    <thead><tr><th>기준</th><th>점수</th></tr></thead>
    <tbody>{{CRITERIA_ROWS}}</tbody>
  </table>
  <p class="score">종합 점수: {{OVERALL_SCORE}}</p>
</section>

<section>
  <h2>파일별 지적 (보조)</h2>
  {{FINDINGS_BLOCKS}}
</section>
</body>
</html>
